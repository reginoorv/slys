    <path d="M40,0 C40,22.1 22.1,40 0,40 C-22.1,40 -40,22.1 -40,0 C-40,-22.1 -22.1,-40 0,-40 C22.1,-40 40,-22.1 40,0" fill="#0B2545" opacity="0.2"/>
    
    <!-- Scissor -->
