      <path d="M-25 10C-15 0 -5 -10 0 -20M25 10C15 0 5 -10 0 -20" fill="none" stroke="#0B2545" stroke-width="5" stroke-linecap="round" />
    </g>
    
    <!-- Hair strands -->
    <path d="M-50 -50C-30 -60 30 -60 50 -50" stroke="#0B2545" stroke-width="3" fill="none" />
    <path d="M-40 -70C-20 -80 20 -80 40 -70" stroke="#0B2545" stroke-width="3" fill="none" />
  </g>
  
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="24" fill="#0B2545" text-anchor="middle" font-weight="bold">Classic Haircut</text>
</svg>