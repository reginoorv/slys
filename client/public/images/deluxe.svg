<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#0B2545" opacity="0.08"/>
  <g transform="translate(250, 110)">
    <path d="M80,0 C80,44.2 44.2,80 0,80 C-44.2,80 -80,44.2 -80,0 C-80,-44.2 -44.2,-80 0,-80 C44.2,-80 80,-44.2 80,0" fill="#0B2545" opacity="0.1"/>
    <path d="M60,0 C60,33.1 33.1,60 0,60 C-33.1,60 -60,33.1 -60,0 C-60,-33.1 -33.1,-60 0,-60 C33.1,-60 60,-33.1 60,0" fill="#0B2545" opacity="0.2"/>
    
    <!-- Crown Icon for Deluxe -->
    <path d="M-60,-20 L-30,20 L0,-10 L30,20 L60,-20 L40,30 L-40,30 Z" fill="#B9A55A" stroke="#0B2545" stroke-width="3"/>
    <circle cx="-40" cy="-10" r="5" fill="#C72C41"/>
    <circle cx="0" cy="-20" r="5" fill="#C72C41"/>
    <circle cx="40" cy="-10" r="5" fill="#C72C41"/>
    
    <!-- Barber Tools -->
    <g transform="translate(-50, 60) rotate(-30) scale(0.5)">
      <!-- Straight Razor -->
      <rect x="-10" y="-40" width="20" height="30" rx="2" fill="#0B2545"/>
      <rect x="-15" y="-15" width="30" height="10" rx="2" fill="#C72C41"/>
      <path d="M-15,-5 L15,-5 L15,0 L-15,0 Z" fill="#B9A55A"/>
      <path d="M-10,0 L10,0 L5,30 L-5,30 Z" fill="#F8F8F8" stroke="#0B2545" stroke-width="1"/>
    </g>
    
    <g transform="translate(0, 60) scale(0.5)">
      <!-- Comb -->
      <rect x="-30" y="-10" width="60" height="15" rx="2" fill="#0B2545"/>
      <path d="M-28,-10 L-28,5 M-24,-10 L-24,5 M-20,-10 L-20,5 M-16,-10 L-16,5 M-12,-10 L-12,5 M-8,-10 L-8,5 M-4,-10 L-4,5 M0,-10 L0,5 M4,-10 L4,5 M8,-10 L8,5 M12,-10 L12,5 M16,-10 L16,5 M20,-10 L20,5 M24,-10 L24,5 M28,-10 L28,5" stroke="#F8F8F8" stroke-width="1"/>
    </g>
    
    <g transform="translate(50, 60) rotate(30) scale(0.5)">
      <!-- Scissors -->
      <circle cx="-20" cy="30" r="10" fill="#C72C41" />
      <circle cx="20" cy="30" r="10" fill="#C72C41" />
      <path d="M-20 20L0 -10M20 20L0 -10" stroke="#0B2545" stroke-width="4" stroke-linecap="round" />
      <path d="M-15 10C-10 0 -5 -5 0 -10M15 10C10 0 5 -5 0 -10" fill="none" stroke="#0B2545" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
  
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="24" fill="#0B2545" text-anchor="middle" font-weight="bold">Deluxe Package</text>
</svg>