<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#B9A55A" opacity="0.08"/>
  <g transform="translate(250, 110)">
    <path d="M70,0 C70,38.6 38.6,70 0,70 C-38.6,70 -70,38.6 -70,0 C-70,-38.6 -38.6,-70 0,-70 C38.6,-70 70,-38.6 70,0" fill="#B9A55A" opacity="0.1"/>
    <path d="M50,0 C50,27.6 27.6,50 0,50 C-27.6,50 -50,27.6 -50,0 C-50,-27.6 -27.6,-50 0,-50 C27.6,-50 50,-27.6 50,0" fill="#B9A55A" opacity="0.2"/>
    
    <!-- Kid's Face -->
    <circle cx="0" cy="-20" r="30" fill="#F8F8F8" stroke="#0B2545" stroke-width="2"/>
    
    <!-- Hair -->
    <path d="M-30,-20 C-30,-40 -15,-50 0,-50 C15,-50 30,-40 30,-20" fill="#0B2545"/>
    <path d="M-25,-20 C-25,-25 -20,-30 -15,-30 C-15,-35 -10,-40 0,-40 C10,-40 15,-35 15,-30 C20,-30 25,-25 25,-20" fill="none" stroke="#C72C41" stroke-width="2"/>
    
    <!-- Eyes -->
    <circle cx="-12" cy="-25" r="3" fill="#0B2545"/>
    <circle cx="12" cy="-25" r="3" fill="#0B2545"/>
    
    <!-- Smile -->
    <path d="M-10,-15 C-5,-10 5,-10 10,-15" fill="none" stroke="#0B2545" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Scissors -->
    <g transform="translate(40, 0) scale(0.6) rotate(45)">
      <!-- Scissor Handles -->
      <circle cx="-30" cy="40" r="15" fill="#C72C41" />
      <circle cx="30" cy="40" r="15" fill="#C72C41" />
      
      <!-- Scissor Blades -->
      <path d="M-30 25L0 -20M30 25L0 -20" stroke="#0B2545" stroke-width="6" stroke-linecap="round" />
      <path d="M-25 10C-15 0 -5 -10 0 -20M25 10C15 0 5 -10 0 -20" fill="none" stroke="#0B2545" stroke-width="5" stroke-linecap="round" />
    </g>
    
    <!-- Balloon -->
    <g transform="translate(-40, -40)">
      <circle cx="0" cy="0" r="15" fill="#C72C41"/>
      <path d="M0,15 C0,20 2,30 0,40" fill="none" stroke="#C72C41" stroke-width="2"/>
    </g>
  </g>
  
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="24" fill="#0B2545" text-anchor="middle" font-weight="bold">Kid's Haircut</text>
</svg>